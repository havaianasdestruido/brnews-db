name: Publicar site (Jekyll + Docusaurus)

# Publica o GitHub Pages do projeto combinando dois geradores:
#   /          -> página inicial, construída com Jekyll a partir de site/
#   /docs      -> documentação completa, construída com Docusaurus a partir de website/
#
# O passo `actions/configure-pages` abaixo usa `enablement: true`, que liga o
# GitHub Pages (origem = "GitHub Actions") sozinho na primeira execução. Sem ele,
# o `deploy-pages` falha com "HttpError: Not Found" enquanto o Pages não tiver
# sido habilitado à mão em Settings > Pages.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Permissão mínima no nível do workflow; o job deploy recebe as suas abaixo.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir Jekyll (raiz) + Docusaurus (/docs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `enablement: true` precisa escrever na configuração do Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Habilita o Pages (origem = GitHub Actions) caso ainda não esteja ligado,
      # evitando o 404 do deploy na primeira publicação do repositório.
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ------------------------------------------------ página inicial (Jekyll)
      - name: Construir a página inicial com Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      # ------------------------------------------------ documentação (Docusaurus)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Construir a documentação com Docusaurus
        working-directory: website
        run: |
          npm ci
          npm run build

      # ------------------------------------------------ juntar e publicar
      - name: Colocar a documentação em /docs
        run: |
          # O container do Jekyll gera _site/ como root; devolve a posse ao runner.
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/docs
          cp -r website/build/. _site/docs/

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Só o deploy precisa de permissões de publicação (o build fica em contents: read).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
