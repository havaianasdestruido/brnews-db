name: CI

# Valida o coletor a cada push/PR: testes offline + uma coleta de amostra
# (dry-run, não grava nem commita nada) para ver quais feeds respondem.
on:
  push:
    branches-ignore:
      - "gh-pages"
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "rss.txt"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:
    inputs:
      max_feeds:
        description: "Quantos feeds testar na amostra (0 = todos)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  testes:
    name: Testes offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: unittest
        run: python -m unittest discover -s tests -v
      - name: Validar rss.txt
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from brnews.feedlist import load_feeds
          feeds = load_feeds("rss.txt")
          print(f"{len(feeds)} feeds válidos "
                f"({sum(f.is_html for f in feeds)} páginas HTML)")
          assert feeds, "rss.txt não tem feeds válidos"
          PY

  amostra:
    name: Coleta de amostra (dry-run, rede real)
    runs-on: ubuntu-latest
    needs: testes
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Coletar amostra sem gravar nada
        env:
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          # Entrada via ambiente (nunca interpolada no shell) e validada abaixo.
          IN_MAX_FEEDS: ${{ inputs.max_feeds || '20' }}
        run: |
          set -euo pipefail
          if ! [[ "${IN_MAX_FEEDS}" =~ ^[0-9]+$ ]]; then
            echo "::error::max_feeds='${IN_MAX_FEEDS}' inválido: use um inteiro não negativo." >&2
            exit 1
          fi

          python scripts/collect_news.py \
            --dry-run --verbose \
            --max-feeds "${IN_MAX_FEEDS}" \
            --limit-per-feed 3 \
            --attempts 3 \
            --workers 8 \
            --timeout 25 \
            --no-content
